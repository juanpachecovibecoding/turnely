services:
  - type: web
    name: turnely-odontologia
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: PORT
        value: 3000
      - key: ADMIN_PIN
        value: 1234
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
